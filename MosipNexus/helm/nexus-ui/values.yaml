## MOSIP Nexus UI — Helm values
## Faithful, values-driven equivalent of the raw manifests in ../../k8s/.
## Prerequisite: install helm/nexus-server first (same namespace) — the
## UI's nginx proxies same-origin /api/* to the "nexus-api" Service.

namespace: mosip-nexus

commonLabels: {}
commonAnnotations: {}
extraDeploy: []

serviceAccount:
  create: true
  name: ""

image:
  registry: docker.io
  repository: nexus-ui
  tag: v1.0.0
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

containerPort: 8501

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "500m"
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: 8501
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: 8501
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 5

service:
  port: 8501

## ── Routing ───────────────────────────────────────────────────────────────────
## mode: "istio" (default) — renders templates/virtualservice.yaml against the
##       existing Gateway named in `istio.gateway` below, matching MOSIP's
##       other Helm charts (keymanager, identity).
##       "nginx" — renders templates/ingress.yaml + cert-manager, using the
##       `ingress.*` block below, matching ../../k8s/03-ingress-ui.yaml.
## Exactly one of `ingress` / `istio` is ever rendered — whichever `mode` picks.
routing:
  mode: istio

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    host: nexus.mosip.net
    tls:
      enabled: true
      secretName: nexus-ui-tls

  istio:
    ## Existing Gateway to attach to (namespace/name). Ignored when
    ## createGateway: true — the chart creates and uses its own instead.
    gateway: istio-system/internal
    ## If true, renders templates/gateway.yaml — a Gateway named "nexus-ui" in
    ## `namespace`, selecting `istioSelector` — instead of using an existing
    ## one. Use this when no Gateway already has your UI host registered.
    createGateway: true
    ## Selector for the ingress gateway workload the created Gateway attaches
    ## to. Must match an existing Istio ingress gateway Deployment's pod
    ## labels — check with `kubectl get gateway -A -o yaml` on your cluster.
    istioSelector:
      istio: ingressgateway-internal
    istioPort: 80
    hosts:
      - dashboard.nexus.mosip.net
    prefix: /
    ## TLS termination at the created Gateway (only applies when
    ## createGateway: true). When enabled, the Gateway listens on `tlsPort`
    ## with SIMPLE TLS using a Kubernetes Secret named `tls.credentialName`
    ## (type kubernetes.io/tls) in the ingress gateway's namespace, instead of
    ## plain HTTP on `istioPort`.
    tls:
      enabled: false
      credentialName: ""
    tlsPort: 443
    ## When createGateway: false (attaching to an existing Gateway you don't
    ## control here), this chart can't know whether that Gateway terminates
    ## TLS — set explicitly. Only affects the x-forwarded-proto header the
    ## VirtualService sets for nexus-api.
    existingGatewayTls: true

extraEnvVars: []
extraEnvVarsCM: []
extraEnvVarsSecret: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
## fsGroup makes the emptyDir volumes mounted at /var/cache/nginx and
## /var/run group-writable by the pod's supplementary group, regardless of
## the exact UID the nginx:1.27-alpine image's "nginx" user was assigned at
## build time (Alpine's apk creates it with -S, no fixed UID) — this is the
## only thing that needs the containers to actually be writable there when
## containerSecurityContext.readOnlyRootFilesystem is true.
podSecurityContext:
  enabled: true
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
