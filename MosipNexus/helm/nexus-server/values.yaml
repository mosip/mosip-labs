## MOSIP Nexus Server — Helm values
## Faithful, values-driven equivalent of the raw manifests in ../../k8s/.
## See README.md for the full parameter reference.
##
## Deployed into whatever namespace `helm install`/`upgrade -n <ns>` targets —
## every template uses .Release.Namespace, not a separate values-driven
## namespace field, so there's exactly one place that decides where resources
## land (matching the pattern used by other MOSIP module charts, e.g. kernel).

## Default StorageClass for every PVC this chart creates (postgres, updater,
## backup). Leave "" to use the cluster's default StorageClass. Each PVC's own
## `*.storageClassName` below overrides this when set — so you can pin one
## component to a different class (e.g. Longhorn for postgres, nfs-csi for
## backups) while the rest inherit this default. Set to "-" here (or on a
## per-component field) to disable dynamic provisioning entirely for
## whichever PVCs use it.
storageClassName: ""

## Add labels/annotations to every resource this chart creates.
##
commonLabels: {}
commonAnnotations: {}

## Extra raw manifests to deploy alongside this chart (evaluated as a template).
##
extraDeploy: []

serviceAccount:
  create: true
  ## If not set and create is true, defaults to "nexus-api".
  name: ""

image:
  registry: docker.io
  repository: nexus-server
  tag: v1.0.0
  ## Always IfNotPresent (see nexus-server.imagePullPolicy in _helpers.tpl) —
  ## never use :latest in production, since a cached image on a node won't be
  ## re-pulled even if the tag has since moved.
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

## ── API process ──────────────────────────────────────────────────────────────
## Command run inside the container — mirrors Server/Dockerfile's default CMD,
## explicit here so workers/concurrency are values-driven.
api:
  containerPort: 8000
  workers: 1
  limitConcurrency: 64

  resources:
    requests:
      cpu: 500m
      memory: 1500Mi
    limits:
      cpu: "2"
      memory: 4Gi

  ## Covers slow first-time startup (model downloads, migrations) without weakening
  ## how fast liveness/readiness react once the container is actually up.
  startupProbe:
    enabled: true
    httpGet:
      path: /health
      port: 8000
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  ## Non-secret env vars merged onto the container (secrets come from the
  ## existingSecret Secret — see `secret` below).
  env:
    PYTHONPATH: /app/MosipNexus/Server
    PG_POOL_SIZE: "10"
    PG_MAX_OVERFLOW: "20"
    MAX_CONCURRENT_CHATS: "32"
    RETRIEVAL_PARALLELISM: "4"
    SESSION_TTL_SECONDS: "3600"

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  ## ── Routing ─────────────────────────────────────────────────────────────────
  ## mode: "istio" (default) — renders templates/virtualservice.yaml against the
  ##       existing Gateway named in `istio.gateway` below (matches MOSIP's
  ##       other Helm charts, e.g. keymanager, identity).
  ##       "nginx" — renders templates/ingress.yaml + cert-manager, using the
  ##       `ingress.*` block below, matching Server/k8s/05-ingress-api.yaml.
  ## Exactly one of `ingress` / `istio` is ever rendered — whichever `mode` picks.
  routing:
    mode: istio

    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/configuration-snippet: |
          location = /metrics {
            return 403;
          }
      host: nexus-api.mosip.net
      tls:
        enabled: true
        secretName: nexus-api-tls

    istio:
      ## Existing Istio Gateway this VirtualService attaches to (namespace/name).
      gateway: istio-system/internal
      hosts:
        - api-internal.nexus.mosip.net
      prefix: /

## Extra env vars / envFrom sources merged onto the nexus-api container.
extraEnvVars: []
# - name: FOO
#   value: "bar"
extraEnvVarsCM: []
extraEnvVarsSecret: []

## ── Secrets ───────────────────────────────────────────────────────────────────
## This chart never creates or manages the "nexus-env" Secret itself — only
## ever references one that already exists (envFrom: secretRef, via
## nexus-server.secretName below). Real deployments always go through
## deploy/nexus-server/install.sh, which creates it directly with `kubectl`
## (interactive password prompt — never `--set`, an env var, or
## auto-generated) and passes --set secret.existingSecret=nexus-env. The
## full list of keys the app reads mirrors Server/.env.example.
secret:
  ## Name of the pre-existing Secret to read env vars from. Defaults to
  ## "nexus-env" (see nexus-server.secretName in _helpers.tpl) if left empty.
  existingSecret: ""

## ── Postgres (pgvector) ───────────────────────────────────────────────────────
## Mirrors Server/k8s/01-postgres.yaml. Set to false to point PG_CONNECTION at
## an externally managed Postgres/pgvector instance instead.
postgres:
  enabled: true
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: pg16
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  storage:
    size: 20Gi
    ## Overrides the top-level `storageClassName` for the postgres-data PVC only.
    storageClassName: ""
    ## Intentionally not configurable: this PVC is mounted by exactly one pod
    ## (the postgres StatefulSet's single replica) and must stay ReadWriteOnce
    ## — Postgres assumes exclusive access to its data directory, so RWX here
    ## risks corruption rather than solving a real problem.

## ── Nightly incremental crawl + re-embed ─────────────────────────────────────
## Mirrors Server/k8s/06-cronjob.yaml.
updater:
  enabled: true
  schedule: "0 2 * * *"
  activeDeadlineSeconds: 21600
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  pvc:
    size: 10Gi
    ## Overrides the top-level `storageClassName` for the nexus-data PVC only.
    storageClassName: ""
    ## Mounted by both the nightly updater CronJob and the one-time
    ## initialIngest hook Job, on whichever node each gets scheduled to.
    ## Switch to [ReadWriteMany] on a class that supports it (nfs-csi,
    ## nfs-client, Longhorn RWX) to avoid a pod getting stuck waiting for a
    ## ReadWriteOnce volume to detach/reattach across nodes between runs.
    accessModes:
      - ReadWriteOnce

## ── Daily pg_dump backup ──────────────────────────────────────────────────────
## Mirrors Server/k8s/08-postgres-backup.yaml.
backup:
  enabled: true
  schedule: "30 3 * * *"
  activeDeadlineSeconds: 3600
  retention: 7
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  pvc:
    size: 20Gi
    ## Overrides the top-level `storageClassName` for the nexus-db-backups PVC only.
    storageClassName: ""
    ## Mounted by the nightly backup CronJob, on whichever node it gets
    ## scheduled to. Same reasoning as updater.pvc.accessModes above.
    accessModes:
      - ReadWriteOnce

## ── One-time S3 vector snapshot restore ───────────────────────────────────────
## Mirrors Server/k8s/07-initial-ingest-job.yaml. Runs as a post-install Helm
## hook — fires once on `helm install` when enabled, never on `helm upgrade`.
## Requires AWS_* / S3_VECTORS_* keys in the existingSecret Secret.
## Requires updater.enabled: true (uses the same "nexus-data" PVC).
initialIngest:
  enabled: false
  activeDeadlineSeconds: 3600
  ## Pinned by digest (not :latest) so the download-vectors init container's
  ## behavior can't change out from under this chart without a values bump.
  ## Update deliberately: `docker manifest inspect amazon/aws-cli:<tag>` (or
  ## the Docker Hub API) for the new tag's manifest-list digest.
  awsCli:
    image:
      repository: amazon/aws-cli
      tag: "2.17.62"
      digest: sha256:183d4bb76169d35c12ba99e3384b605fee9a72fcb7ff1eeaa857fc27aa8fc713
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

## ── Prometheus monitoring ─────────────────────────────────────────────────────
## Mirrors Server/k8s/10-monitoring.yaml. Requires the Prometheus Operator
## CRDs (ServiceMonitor, PrometheusRule) — e.g. Rancher Monitoring.
metrics:
  enabled: false
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: rancher-monitoring
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true
    additionalLabels:
      release: rancher-monitoring

## ── Let's Encrypt ClusterIssuer ───────────────────────────────────────────────
## Cluster-scoped — normally applied once per cluster, outside any app release.
## Mirrors Server/k8s/letsencrypt-prod-clusterissuer.yaml. Only relevant when
## api.routing.mode: nginx.
clusterIssuer:
  create: false
  name: letsencrypt-prod
  email: your-email@mosip.io

## Pod-level scheduling / security passthroughs.
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
podSecurityContext:
  enabled: false
containerSecurityContext:
  enabled: false
