{{- if .Values.initialIngest.enabled }}
{{- if not .Values.updater.enabled }}
{{ fail "initialIngest.enabled requires updater.enabled: true (initialIngest mounts the nexus-data PVC that the updater creates)." }}
{{- end }}
{{- if not .Values.postgres.enabled }}
{{ fail "initialIngest.enabled requires postgres.enabled: true (initialIngest restores to nexus-postgres, which doesn't render when postgres.enabled is false)." }}
{{- end }}
# One-time bootstrap: restore vectors from an S3 snapshot instead of a 4-8 hour
# re-embed. Runs as a post-install hook — fires once on `helm install` and
# never again on `helm upgrade`. To re-run after a fresh snapshot:
#   helm upgrade nexus-server . --install
# (hook-delete-policy removes the completed Job first, so this recreates it.)
#
# Prerequisites: a snapshot already in S3 (Server/k8s/dump-vectors-to-s3.sh),
# and the existingSecret Secret containing AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION, S3_VECTORS_BUCKET, S3_VECTORS_KEY.
apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-initial-ingest
  namespace: {{ .Values.namespace }}
  labels: {{- include "nexus-server.labels" (dict "name" "nexus-initial-ingest" "ctx" $) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.initialIngest.activeDeadlineSeconds }}
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 999
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.registry }}/{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              until pg_isready -h nexus-postgres -p 5432 -U mosip; do
                echo "Waiting for nexus-postgres..."
                sleep 5
              done
              echo "PostgreSQL is ready."
        - name: download-vectors
          image: "{{ .Values.initialIngest.awsCli.image.repository }}@{{ .Values.initialIngest.awsCli.image.digest }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Downloading vectors snapshot from s3://$S3_VECTORS_BUCKET/$S3_VECTORS_KEY ..."
              aws s3 cp "s3://$S3_VECTORS_BUCKET/$S3_VECTORS_KEY" /vectors/nexus_vectors.dump.gz
              echo "Download complete: $(du -sh /vectors/nexus_vectors.dump.gz | cut -f1)"
              STATE_KEY="${S3_VECTORS_KEY%.*.*}_crawl_state.json"
              if aws s3 ls "s3://$S3_VECTORS_BUCKET/$STATE_KEY" > /dev/null 2>&1; then
                aws s3 cp "s3://$S3_VECTORS_BUCKET/$STATE_KEY" /vectors/crawl_state.json
                echo "crawl_state.json downloaded."
              else
                echo "No crawl_state.json found in S3 — updater will do a full delta on first run."
              fi
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus-server.secretName" . }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus-server.secretName" . }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus-server.secretName" . }}
                  key: AWS_DEFAULT_REGION
            - name: S3_VECTORS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus-server.secretName" . }}
                  key: S3_VECTORS_BUCKET
            - name: S3_VECTORS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nexus-server.secretName" . }}
                  key: S3_VECTORS_KEY
          volumeMounts:
            - name: vectors-transfer
              mountPath: /vectors
      containers:
        - name: restore-vectors
          image: "{{ .Values.postgres.image.registry }}/{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              set -e
              echo "Decompressing dump..."
              gunzip /vectors/nexus_vectors.dump.gz

              echo "Restoring into nexus-postgres (this takes ~5-10 minutes)..."
              # --clean --if-exists makes this idempotent (won't error) whether
              # postgres-data is empty or already has a prior restore on it. It is
              # NOT consequence-free: --clean discards any data added since the
              # snapshot, and running this while nexus-api serves traffic can cause
              # request failures mid-restore. Stop traffic and take a fresh backup
              # first if re-running deliberately, don't rely on this for routine ops.
              PGPASSWORD=$POSTGRES_PASSWORD pg_restore \
                -h nexus-postgres \
                -U mosip \
                -d mosipnexus \
                -F c \
                --clean \
                --if-exists \
                --no-owner \
                --no-acl \
                --exit-on-error \
                /vectors/nexus_vectors.dump
              echo "pg_restore complete."

              if [ -f /vectors/crawl_state.json ]; then
                cp /vectors/crawl_state.json /data/crawl_state.json
                echo "crawl_state.json written to nexus-data PVC."
              fi

              echo "Bootstrap complete. The nightly updater will sync any new content."
          envFrom:
            - secretRef:
                name: {{ include "nexus-server.secretName" . }}
          volumeMounts:
            - name: vectors-transfer
              mountPath: /vectors
            - name: nexus-data
              mountPath: /data
          resources: {{- toYaml .Values.initialIngest.resources | nindent 12 }}
      volumes:
        - name: vectors-transfer
          emptyDir: {}
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-data
{{- end }}
