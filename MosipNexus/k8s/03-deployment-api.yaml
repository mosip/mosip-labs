apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api
  namespace: mosip-nexus
  labels:
    app: nexus-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-api
  template:
    metadata:
      labels:
        app: nexus-api
    spec:
      containers:
        - name: nexus-api
          # Built and pushed automatically by .github/workflows/mosip-nexus-docker-publish.yml
          image: mohanachandran45/mosip-nexus:latest
          imagePullPolicy: Always
          command:
            - uv
            - run
            - uvicorn
            - api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "2"
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONPATH
              value: /app/MosipNexus
          envFrom:
            - secretRef:
                name: nexus-env
          volumeMounts:
            - name: nexus-data
              mountPath: /app/MosipNexus/data
          resources:
            requests:
              cpu: 500m
              memory: 1500Mi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60   # model load takes ~30–45s on first request
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
      # Same PVC the nightly nexus-updater CronJob uses (k8s/07-cronjob.yaml) —
      # gives this pod access to data/*.json for one-time ingestion via kubectl exec.
      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-data
