apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ui
  namespace: mosip-nexus
  labels:
    app: nexus-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-ui
  template:
    metadata:
      labels:
        app: nexus-ui
    spec:
      containers:
        - name: nexus-ui
          # Built and pushed automatically by .github/workflows/mosip-nexus-docker-publish.yml
          image: mohanachandran45/mosip-nexus:latest
          imagePullPolicy: Always
          command:
            - uv
            - run
            - streamlit
            - run
            - app/app.py
            - --server.port=8501
            - --server.address=0.0.0.0
          ports:
            - containerPort: 8501
          env:
            - name: PYTHONPATH
              value: /app/MosipNexus
          envFrom:
            - secretRef:
                name: nexus-env
          resources:
            requests:
              cpu: 250m
              memory: 1500Mi
            limits:
              cpu: "1"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
