# ── UI Ingress ────────────────────────────────────────────────────────────────
# Replace nexus.mosip.net with your actual domain.
# Requires:
#   - nginx ingress controller (default on Rancher / RKE2)
#   - cert-manager + letsencrypt-prod ClusterIssuer (see Server/k8s/05-ingress-api.yaml)
#
# Access after deploy:
#   React UI  → https://nexus.mosip.net
#
# Apply Server/k8s first (namespace + API). This Ingress only routes the UI.
# API calls from the browser use same-origin /api (proxied by the UI nginx pod).

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-ui
  namespace: mosip-nexus
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # cert-manager issues and auto-renews the TLS certificate
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nexus.mosip.net               # replace with your domain
      secretName: nexus-ui-tls          # cert-manager stores the cert here
  rules:
    - host: nexus.mosip.net             # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-ui
                port:
                  number: 8501
