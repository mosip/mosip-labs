# ── Nightly incremental knowledge update ──────────────────────────────────────
# Runs run_update.py every night at 02:00 UTC (07:30 IST).
# Only crawls and embeds content that changed since the last run.
# Average runtime: 5–15 min (full first run: 3–6 hours).
#
# The data/ PVC persists the crawled JSON files and crawl_state.json between runs.
# On first deployment, trigger a manual run:
#   kubectl create job --from=cronjob/nexus-updater nexus-updater-init -n mosip-nexus

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  namespace: mosip-nexus
spec:
  # ReadWriteOnce is safe here: only the CronJob (and ingest Job) mount this PVC.
  # The API pod does NOT mount it — removing that mount was the fix for RWO node
  # contention (see 03-deployment-api.yaml). If your cluster schedules the CronJob
  # on a different node each run and your storage class does not support node
  # migration (e.g. local-path), switch to ReadWriteMany with Longhorn or NFS.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: longhorn   # recommended for multi-node clusters

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nexus-updater
  namespace: mosip-nexus
spec:
  schedule: "0 2 * * *"           # 02:00 UTC daily
  concurrencyPolicy: Forbid       # don't run two updates at the same time
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Kill the job if it runs longer than 6 hours — prevents a hung crawl
      # from blocking the next night's run (concurrencyPolicy: Forbid above).
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: updater
              # Pin to a semver tag — never use :latest in production.
              image: nexus-server:v1.0.0
              imagePullPolicy: IfNotPresent
              command:
                - uv
                - run
                - python
                - run_update.py
              env:
                - name: PYTHONPATH
                  value: /app/MosipNexus/Server
              envFrom:
                - secretRef:
                    name: nexus-env
              volumeMounts:
                - name: nexus-data
                  mountPath: /app/MosipNexus/Server/data
              resources:
                requests:
                  cpu: "1"
                  memory: 4Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
          volumes:
            - name: nexus-data
              persistentVolumeClaim:
                claimName: nexus-data
