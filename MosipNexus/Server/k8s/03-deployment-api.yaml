apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api
  namespace: mosip-nexus
  labels:
    app: nexus-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-api
  template:
    metadata:
      labels:
        app: nexus-api
    spec:
      containers:
        - name: nexus-api
          # Pin to a semver tag — never use :latest in production.
          # Update this tag whenever Server/Dockerfile is rebuilt and pushed.
          image: nexus-server:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - uvicorn
            - api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            # Prefer 1–2 workers: HF embedder is ~1GB/process. Sessions are in Postgres.
            - --workers
            - "1"
            - --limit-concurrency
            - "64"
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONPATH
              value: /app/MosipNexus/Server
            - name: PG_POOL_SIZE
              value: "10"
            - name: PG_MAX_OVERFLOW
              value: "20"
            - name: MAX_CONCURRENT_CHATS
              value: "32"
            - name: RETRIEVAL_PARALLELISM
              value: "4"
            - name: SESSION_TTL_SECONDS
              value: "3600"
          envFrom:
            - secretRef:
                name: nexus-env
          resources:
            requests:
              cpu: 500m
              memory: 1500Mi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60   # model load takes ~30–45s on first request
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
      # No data PVC — the API reads only from pgvector at runtime.
      # Mounting nexus-data here would hold the ReadWriteOnce PVC on this node
      # and prevent the nightly CronJob from mounting it if scheduled elsewhere.
