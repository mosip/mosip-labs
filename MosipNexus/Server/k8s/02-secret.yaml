# ── Secrets template ───────────────────────────────────────────────────────────
# Fill in your real values before applying.
# stringData values are plain text — Kubernetes base64-encodes them automatically.
#
# Apply with:
#   kubectl apply -f Server/k8s/02-secret.yaml
#
# DO NOT commit this file with real values filled in.
# Use sealed-secrets or Rancher Vault integration in production.
#
# For Inji (or another product), change PRODUCT_* / DOCS_* / COMMUNITY_* /
# GITHUB_* below — Server code stays the same.

apiVersion: v1
kind: Secret
metadata:
  name: nexus-env
  namespace: mosip-nexus
type: Opaque
stringData:
  # ── Required ─────────────────────────────────────────────────────────────────
  GROQ_API_KEY: "<YOUR_GROQ_API_KEY>"

  # PostgreSQL credentials — must match what 01-postgres.yaml creates
  POSTGRES_PASSWORD: "<YOUR_POSTGRES_PASSWORD>"
  PG_CONNECTION: "postgresql+psycopg://mosip:<YOUR_POSTGRES_PASSWORD>@nexus-postgres:5432/mosipnexus"

  # ── Product identity (same Server for MOSIP or Inji) ─────────────────────────
  PRODUCT_NAME: "MOSIP Nexus"
  PRODUCT_SHORT: "MOSIP"
  PRODUCT_SLUG: "mosip"

  # ── Crawl / knowledge targets ────────────────────────────────────────────────
  DOCS_BASE_URL: "https://docs.mosip.io/1.2.0"
  # DOCS_SITEMAP_URL: ""   # defaults to {DOCS_BASE_URL}/sitemap.xml
  COMMUNITY_BASE_URL: "https://community.mosip.io"
  COMMUNITY_NEW_TOPIC_PATH: "/new-topic"

  GITHUB_ORG: "mosip"
  # Comma-separated org/name list used when GITHUB_TOKEN is empty
  # GITHUB_REPOS: "mosip/id-authentication,mosip/registration"
  # GITHUB_REPO_EXCLUDE: "documentation,.github"

  # ── Optional — GitHub (5,000 req/hr vs 60 unauthenticated) ──────────────────
  GITHUB_TOKEN: ""

  # ── Optional — Confluence (Atlassian API token) ──────────────────────────────
  CONFLUENCE_URL: "https://your-org.atlassian.net/wiki"
  CONFLUENCE_USER: "your_email@example.com"
  CONFLUENCE_TOKEN: ""
  CONFLUENCE_SPACE_KEYS: "QT,ENGG,PMS"

  # ── Optional — Jira ──────────────────────────────────────────────────────────
  JIRA_URL: "https://your-org.atlassian.net"
  JIRA_USER: "your_email@example.com"
  JIRA_TOKEN: ""
  JIRA_PROJECT_KEYS: "MOSIP,MISP"

  # ── Optional — LangSmith observability ──────────────────────────────────────
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_API_KEY: ""
  LANGCHAIN_PROJECT: "mosip-nexus"

  # ── S3 vectors snapshot (for fast initial deployment restore) ────────────────
  # Engineering uploads a pg_dump snapshot to S3 (using dump-vectors-to-s3.sh).
  # The initial ingest Job (07-initial-ingest-job.yaml) restores from here
  # instead of re-embedding everything from scratch (10 min vs 4–8 hours).
  AWS_ACCESS_KEY_ID: "<YOUR_AWS_ACCESS_KEY_ID>"
  AWS_SECRET_ACCESS_KEY: "<YOUR_AWS_SECRET_ACCESS_KEY>"
  AWS_DEFAULT_REGION: "ap-south-1"
  S3_VECTORS_BUCKET: "<YOUR_S3_BUCKET_NAME>"
  S3_VECTORS_KEY: "nexus/nexus_vectors_latest.dump.gz"

  # ── Optional — HuggingFace token (not required for public models) ────────────
  HF_TOKEN: ""

  # ── Optional — Email alerts ──────────────────────────────────────────────────
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  NOTIFY_EMAIL: ""
