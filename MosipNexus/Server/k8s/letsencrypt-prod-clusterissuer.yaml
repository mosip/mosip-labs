# ── Let's Encrypt ClusterIssuer ───────────────────────────────────────────────
# Apply once per cluster before applying any Ingress with TLS annotations.
# Requires cert-manager to be installed (Rancher UI → Apps → cert-manager).
#
# 1. Set spec.acme.email to a real address — Let's Encrypt sends certificate
#    expiry warnings there.
# 2. Apply:
#      kubectl apply -f Server/k8s/letsencrypt-prod-clusterissuer.yaml
# 3. Verify:
#      kubectl get clusterissuer letsencrypt-prod

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@mosip.io        # CHANGE: receives cert expiry warnings
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
