# ── API Ingress ───────────────────────────────────────────────────────────────
# Replace nexus-api.mosip.net with your actual domain.
# Requires:
#   - nginx ingress controller (default on Rancher / RKE2)
#   - cert-manager installed: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#   - ClusterIssuer named letsencrypt-prod (see comment below)
#
# Access after deploy:
#   FastAPI docs  → https://nexus-api.mosip.net/docs
#
# UI ingress lives under UI/k8s/03-ingress-ui.yaml

# ── ClusterIssuer (apply once per cluster) ────────────────────────────────────
# apiVersion: cert-manager.io/v1
# kind: ClusterIssuer
# metadata:
#   name: letsencrypt-prod
# spec:
#   acme:
#     server: https://acme-v02.api.letsencrypt.org/directory
#     email: your-email@mosip.io        # receives cert expiry warnings
#     privateKeySecretRef:
#       name: letsencrypt-prod-key
#     solvers:
#       - http01:
#           ingress:
#             class: nginx
# -----------------------------------------------------------------------------

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-api
  namespace: mosip-nexus
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # cert-manager issues and auto-renews the TLS certificate
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Block external access to /metrics — internal ServiceMonitor scrapes via ClusterIP only
    nginx.ingress.kubernetes.io/configuration-snippet: |
      location = /metrics {
        return 403;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nexus-api.mosip.net           # replace with your domain
      secretName: nexus-api-tls         # cert-manager stores the cert here
  rules:
    - host: nexus-api.mosip.net         # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-api
                port:
                  number: 8000
