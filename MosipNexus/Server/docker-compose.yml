# Server stack only: postgres + API + MCP
# From repo root:
#   docker compose -f Server/docker-compose.yml --env-file Server/.env up --build
#
# Or from Server/:
#   docker compose --env-file .env up --build

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mosipnexus
      POSTGRES_USER: mosip
      POSTGRES_PASSWORD: mosip
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./k8s/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosip -d mosipnexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexus-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-server:latest
    command:
      - uv
      - run
      - uvicorn
      - api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "${UVICORN_WORKERS:-1}"
      - --limit-concurrency
      - "${UVICORN_LIMIT_CONCURRENCY:-64}"
    env_file:
      - path: .env
        required: false
    environment:
      PG_CONNECTION: "postgresql+psycopg://mosip:mosip@postgres:5432/mosipnexus"
      PYTHONPATH: /app/MosipNexus/Server
      PG_POOL_SIZE: "${PG_POOL_SIZE:-10}"
      PG_MAX_OVERFLOW: "${PG_MAX_OVERFLOW:-20}"
      MAX_CONCURRENT_CHATS: "${MAX_CONCURRENT_CHATS:-32}"
      RETRIEVAL_PARALLELISM: "${RETRIEVAL_PARALLELISM:-4}"
    volumes:
      - ./data:/app/MosipNexus/Server/data
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1500M

  nexus-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-server:latest
    command:
      - uv
      - run
      - python
      - mcp_server/server.py
    env_file:
      - path: .env
        required: false
    environment:
      PG_CONNECTION: "postgresql+psycopg://mosip:mosip@postgres:5432/mosipnexus"
      PYTHONPATH: /app/MosipNexus/Server
      MCP_PORT: "8002"
      MCP_TRANSPORT: "sse"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

networks:
  default:
    name: nexus-net
