[project]
name = "nexus-server"
version = "1.0.0"
description = "Nexus Server — RAG API, crawlers, ingestion, MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "langchain>=1.2.15",
    "langchain-postgres>=0.0.17",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.0",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langdetect>=1.0.9",
    "langsmith>=0.3.0",
    "markdownify>=1.2.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.4.1",
    "transformers>=4.47.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.13.3",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "mcp>=1.0",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
