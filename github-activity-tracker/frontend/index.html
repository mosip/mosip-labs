<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GitHub Activity Dashboard for tracking pull requests, issues, and reviews" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>GitHub Activity Dashboard</title>
    <script>
      (function () {
        try {
          var allowed = /^(sky|teal|sunset|forest|violet|graphite|midnight)$/;
          var theme = localStorage.getItem("gat-theme") || "sky";
          if (!allowed.test(theme)) theme = "sky";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme =
            theme === "midnight" ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
