# Package prefix owned by a service, and the git repository that prefix lives in.
# A stack frame matches the longest prefix. Rows come from the jars on the 131ga cluster,
# and each repo was checked against the commit inside that jar.
# Not mapped: resident-service (the develop image has no git commit in the jar),
# websub (hub.jar has no build info), io.mosip.vercred, and the UI images.
# kernel.core and kernel.dataaccess were checked in mosip/commons at 4592962e.
# io.mosip.commons.packet was checked in mosip/packet-manager at d94a06af.
sources:
  - prefix: io.mosip.admin
    repo: https://github.com/mosip/admin-services
    artifacts: [admin-service]
