name: tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Package data includes sources.yaml
        run: python -c "from importlib.resources import files; files('roottrace').joinpath('sources.yaml').read_text()"
      - name: Self-tests
        env:
          PYTHONUTF8: "1"
        run: |
          python tests/test_e2e.py
          python tests/test_deps.py
          python tests/test_code.py
          python tests/test_buildinfo.py
          python tests/test_service_name.py
          python tests/test_warn.py
          python tests/test_solid.py
