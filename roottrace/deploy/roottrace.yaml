# kubectl apply -f deploy/roottrace.yaml   (or import via Rancher "Import YAML")
# Edit: image, Ingress host, environment_name, public_url, and the Secret values.
apiVersion: v1
kind: Namespace
metadata: {name: roottrace}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: roottrace, namespace: roottrace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: roottrace-readonly}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Used only when k8s.revisions is true, to read git.properties from the running jar.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: roottrace-readonly}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: roottrace-readonly}
subjects: [{kind: ServiceAccount, name: roottrace, namespace: roottrace}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: roottrace-config, namespace: roottrace}
data:
  config.yaml: |
    environment_name: 131ga
    public_url: null
    grafana_url: null
    loki:
      url: http://loki.loki-monitoring.svc:3100
    k8s:
      enabled: true
      evidence: true
      revisions: true
    baseline_offset: 24h
    report_history: 48
---
apiVersion: v1
kind: Secret
metadata: {name: roottrace-secrets, namespace: roottrace}
type: Opaque
stringData:
  ROOTTRACE_SLACK_WEBHOOK: ""
  ROOTTRACE_LOKI_USER: ""
  ROOTTRACE_LOKI_PASSWORD: ""
  # Empty token leaves the API open inside the cluster. Set one before exposing the Ingress.
  ROOTTRACE_API_TOKEN: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: roottrace-reports, namespace: roottrace}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: roottrace, namespace: roottrace}
spec:
  replicas: 1
  selector: {matchLabels: {app: roottrace}}
  template:
    metadata: {labels: {app: roottrace}}
    spec:
      serviceAccountName: roottrace
      containers:
        - name: roottrace
          image: REGISTRY/roottrace:0.1.0
          ports: [{containerPort: 8080}]
          envFrom: [{secretRef: {name: roottrace-secrets}}]
          volumeMounts:
            - {name: cfg, mountPath: /etc/roottrace}
            - {name: reports, mountPath: /var/roottrace}
          readinessProbe: {httpGet: {path: /health, port: 8080}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - {name: cfg, configMap: {name: roottrace-config}}
        - {name: reports, persistentVolumeClaim: {claimName: roottrace-reports}}
---
apiVersion: v1
kind: Service
metadata: {name: roottrace, namespace: roottrace}
spec:
  selector: {app: roottrace}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: roottrace, namespace: roottrace}
spec:
  rules:
    - host: roottrace.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: roottrace, port: {number: 80}}
---
# Cluster pods can reach the API. The token, when set, is what keeps a scan from being anonymous.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: roottrace-api, namespace: roottrace}
spec:
  podSelector: {matchLabels: {app: roottrace}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 8080}
---
# Continuous mode: every 30 min scan the last 30 min; post to Slack only when unhealthy.
apiVersion: batch/v1
kind: CronJob
metadata: {name: roottrace-scan, namespace: roottrace}
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: curlimages/curl:8.10.1
              envFrom: [{secretRef: {name: roottrace-secrets}}]
              command: ["sh", "-c"]
              args:
                - |
                  auth=()
                  if [ -n "$ROOTTRACE_API_TOKEN" ]; then auth=(-H "Authorization: Bearer $ROOTTRACE_API_TOKEN"); fi
                  exec curl -sf --max-time 600 "${auth[@]}" "http://roottrace.roottrace.svc/scan?since=30m&slack=1&only_if=unhealthy"
